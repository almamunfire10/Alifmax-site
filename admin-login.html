<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | Alif Ahmed Alvi fm</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #061322, #0b1730);
      color: #f4f7fb;
    }
    .panel {
      width: min(420px, calc(100% - 24px));
      background: rgba(11, 25, 47, 0.78);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }
    h1 { margin-top: 0; }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.04);
      color: #fff;
      margin: 10px 0 16px;
    }
    button {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(90deg, #75e6ff, #9a7cff);
      color: #041423;
      font-weight: 700;
      cursor: pointer;
    }
    p { color: #b9c3d4; }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Admin Access</h1>
    <p>Enter the password to manage photos and videos on your personal site.</p>
    <form method="POST" action="/login">
      <input type="password" name="password" placeholder="Password" required />
      <button type="submit">Enter Dashboard</button>
    </form>
  </div>
</body>
</html>
